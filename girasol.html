<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

<title>🌻 Nuestro campo</title>


<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

}

body {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    background:
        #729eb2;

}


/* =====================================================
   ESCENA
===================================================== */

.escena {

    position: relative;

    width: 100vw;
    height: 100svh;

    overflow: hidden;

    background:

        linear-gradient(
            to bottom,

            #719daf 0%,
            #a9c2c5 28%,
            #c4cfca 42%,
            #779957 57%,
            #4a7a31 75%,
            #315d23 100%
        );

}


/* =====================================================
   SOL
===================================================== */

.sol {

    position: absolute;

    width: 85px;
    height: 85px;

    right: 12%;
    top: 8%;

    border-radius: 50%;

    background:
        rgba(255,222,116,.7);

    box-shadow:
        0 0 40px
        rgba(255,230,145,.55);

}


/* =====================================================
   NUBES
===================================================== */

.nube {

    position: absolute;

    width: 160px;
    height: 42px;

    background:
        rgba(255,255,255,.45);

    border-radius: 50px;

    filter: blur(5px);

}


.nube::before,
.nube::after {

    content: "";

    position: absolute;

    background:
        rgba(255,255,255,.45);

    border-radius: 50%;

}


.nube::before {

    width: 65px;
    height: 65px;

    left: 20px;
    bottom: 5px;

}


.nube::after {

    width: 80px;
    height: 80px;

    right: 20px;
    bottom: 0;

}


.nube1 {

    top: 12%;
    left: -60px;

}


.nube2 {

    top: 25%;
    right: -70px;

    transform:
        scale(.7);

}


.nube3 {

    top: 17%;
    left: 35%;

    transform:
        scale(.45);

    opacity: .35;

}


/* =====================================================
   CAMPO
===================================================== */

.campo {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 56%;

    overflow: hidden;

    background:

        linear-gradient(
            to bottom,

            #71964e,
            #4e7e32 35%,
            #3d6c29 70%,
            #2d5520
        );

}


/* =====================================================
   HORIZONTE
===================================================== */

.horizonte {

    position: absolute;

    left: 0;
    right: 0;

    top: 0;

    height: 30%;

    background:

        linear-gradient(
            to bottom,

            rgba(216,225,218,.85),
            rgba(216,225,218,.2),
            transparent
        );

    filter:
        blur(6px);

    z-index: 300;

    pointer-events: none;

}


/* =====================================================
   GIRASOLES
===================================================== */

#girasoles {

    position: absolute;

    inset: 0;

}


/*
   Cada girasol es SOLO un elemento.

   Esto es muchísimo más liviano
   que tener pétalos, hojas y tallos
   como elementos independientes.
*/

.girasol {

    position: absolute;

    width: 22px;
    height: 65px;

    transform-origin:
        bottom center;

}


/* =====================================================
   FLOR
===================================================== */

.girasol::before {

    content: "";

    position: absolute;

    width: 25px;
    height: 25px;

    left: 50%;
    top: 0;

    transform:
        translateX(-50%);

    border-radius: 50%;

    background:

        radial-gradient(
            circle at center,

            #75410e 0 28%,
            #9b6019 29% 42%,
            transparent 43%
        ),

        conic-gradient(

            #f8d51d 0deg 20deg,
            transparent 20deg 45deg,

            #f8d51d 45deg 65deg,
            transparent 65deg 90deg,

            #f8d51d 90deg 110deg,
            transparent 110deg 135deg,

            #f8d51d 135deg 155deg,
            transparent 155deg 180deg,

            #f8d51d 180deg 200deg,
            transparent 200deg 225deg,

            #f8d51d 225deg 245deg,
            transparent 245deg 270deg,

            #f8d51d 270deg 290deg,
            transparent 290deg 315deg,

            #f8d51d 315deg 335deg,
            transparent 335deg 360deg
        );

}


/* =====================================================
   TALLO
===================================================== */

.girasol::after {

    content: "";

    position: absolute;

    left: 50%;
    bottom: 0;

    width: 4px;
    height: 48px;

    transform:
        translateX(-50%);

    border-radius: 10px;

    background:

        linear-gradient(
            to right,
            #285a20,
            #559638,
            #285a20
        );

}


/* =====================================================
   MOVIMIENTO
===================================================== */

.girasol {

    animation:
        viento 5s ease-in-out infinite;

}


@keyframes viento {

    0%,
    100% {

        rotate:
            -1deg;

    }

    50% {

        rotate:
            1deg;

    }

}


/* =====================================================
   GIRASOL ACTUAL
===================================================== */

.actual {

    position: absolute;

    left: 50%;
    bottom: 8%;

    width: 110px;
    height: 220px;

    transform:
        translateX(-50%);

    z-index: 1000;

    animation:
        vientoGrande 5s ease-in-out infinite;

}


.actual .florGrande {

    position: absolute;

    width: 115px;
    height: 115px;

    left: 50%;
    top: 0;

    transform:
        translateX(-50%);

    border-radius: 50%;

    background:

        radial-gradient(
            circle,

            #70400e 0 25%,
            #956018 26% 35%,
            transparent 36%
        ),

        conic-gradient(

            #ffd91e 0deg 20deg,
            transparent 20deg 45deg,

            #ffd91e 45deg 65deg,
            transparent 65deg 90deg,

            #ffd91e 90deg 110deg,
            transparent 110deg 135deg,

            #ffd91e 135deg 155deg,
            transparent 155deg 180deg,

            #ffd91e 180deg 200deg,
            transparent 200deg 225deg,

            #ffd91e 225deg 245deg,
            transparent 245deg 270deg,

            #ffd91e 270deg 290deg,
            transparent 290deg 315deg,

            #ffd91e 315deg 335deg,
            transparent 335deg 360deg
        );

}


.actual .talloGrande {

    position: absolute;

    left: 50%;
    bottom: 0;

    width: 9px;
    height: 155px;

    transform:
        translateX(-50%);

    background:
        linear-gradient(
            to right,
            #23551d,
            #559637,
            #23551d
        );

    border-radius: 10px;

}


/* =====================================================
   NÚMERO
===================================================== */

.numero {

    position: absolute;

    top: -65px;
    left: 50%;

    transform:
        translateX(-50%);

    padding:
        9px 17px;

    border-radius:
        30px;

    background:
        rgba(255,255,255,.95);

    color:
        #674300;

    white-space:
        nowrap;

    font-size:
        19px;

    font-weight:
        bold;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,.2);

}


/* =====================================================
   SIGUIENTE
===================================================== */

.siguiente {

    position: absolute;

    left: calc(50% + 70px);

    bottom: 7%;

    width: 55px;
    height: 95px;

    z-index: 1100;

    animation:
        crecer 3s ease-in-out infinite;

}


.siguiente .flor {

    position: absolute;

    width: 42px;
    height: 42px;

    left: 50%;

    top: 0;

    transform:
        translateX(-50%);

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            #76440f 0 30%,
            #9a5e16 31% 40%,
            transparent 41%
        ),

        conic-gradient(
            #f8d51d 0deg 30deg,
            transparent 30deg 60deg,
            #f8d51d 60deg 90deg,
            transparent 90deg 120deg,
            #f8d51d 120deg 150deg,
            transparent 150deg 180deg,
            #f8d51d 180deg 210deg,
            transparent 210deg 240deg,
            #f8d51d 240deg 270deg,
            transparent 270deg 300deg,
            #f8d51d 300deg 330deg,
            transparent 330deg
        );

}


.siguiente .tallo {

    position: absolute;

    left: 50%;
    bottom: 0;

    width: 5px;
    height: 65px;

    transform:
        translateX(-50%);

    background:
        #3f7d2c;

    border-radius:
        10px;

}


/* =====================================================
   FRASE
===================================================== */

.frase {

    position: absolute;

    width: 210px;

    left: -85px;

    bottom: 75px;

    padding:
        13px 15px;

    background:
        rgba(255,255,255,.94);

    color:
        #604100;

    border-radius:
        15px;

    text-align:
        center;

    font-size:
        14px;

    line-height:
        1.4;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.18);

}


.frase strong {

    font-size:
        16px;

}


/* =====================================================
   ANIMACIONES
===================================================== */

@keyframes vientoGrande {

    0%,
    100% {

        rotate:
            -.8deg;

    }

    50% {

        rotate:
            .8deg;

    }

}


@keyframes crecer {

    0%,
    100% {

        scale:
            .92;

    }

    50% {

        scale:
            1.05;

    }

}


/* =====================================================
   CELULARES PEQUEÑOS
===================================================== */

@media (max-width: 380px) {

    .actual {

        transform:
            translateX(-50%)
            scale(.85);

        bottom:
            7%;

    }


    .siguiente {

        left:
            calc(50% + 57px);

    }


    .frase {

        width:
            185px;

        left:
            -75px;

    }

}


/* =====================================================
   TABLET / PC
===================================================== */

@media (min-width: 700px) {

    .actual {

        transform:
            translateX(-50%)
            scale(1.15);

    }

    .siguiente {

        left:
            calc(50% + 110px);

    }

}

</style>

</head>


<body>


<div class="escena">


    <div class="sol"></div>


    <div class="nube nube1"></div>
    <div class="nube nube2"></div>
    <div class="nube nube3"></div>


    <!-- CAMPO -->

    <div class="campo">

        <div
            id="girasoles">
        </div>

        <div class="horizonte"></div>

    </div>


    <!-- =================================================
         GIRASOL ACTUAL
    ================================================== -->

    <div class="actual">

        <div
            class="numero"
            id="numero">
        </div>


        <div
            class="florGrande">
        </div>


        <div
            class="talloGrande">
        </div>

    </div>


    <!-- =================================================
         SIGUIENTE DÍA
    ================================================== -->

    <div class="siguiente">


        <div class="frase">

            <strong id="diaSiguiente">
                🌱 Día siguiente
            </strong>

            <br><br>

            ACA VA LA FRASE

        </div>


        <div class="flor"></div>

        <div class="tallo"></div>

    </div>


</div>



<script>

/* =====================================================
   CALCULAR DÍAS
===================================================== */

const inicio =
    new Date("2024-08-04T00:00:00");

const hoy =
    new Date();

inicio.setHours(0,0,0,0);
hoy.setHours(0,0,0,0);


const dias =
    Math.floor(
        (hoy - inicio) /
        (1000 * 60 * 60 * 24)
    );


/* =====================================================
   TEXTO
===================================================== */

document.getElementById(
    "numero"
).textContent =
    `🌻 Día ${dias}`;


document.getElementById(
    "diaSiguiente"
).textContent =
    `🌱 Día ${dias + 1}`;


/* =====================================================
   CAMPO
===================================================== */

const campo =
    document.getElementById(
        "girasoles"
    );


/*
    MITAD DE LOS GIRASOLES

    778 / 2 = 389

    Usamos aproximadamente 389
    elementos en lugar de 778.
*/

const cantidad =
    Math.floor(dias / 2);


/*
    Para que NO se amontonen,
    dividimos visualmente el campo
    en pequeñas zonas.

    Pero NO hacemos filas.

    Cada zona recibe algunos
    girasoles aleatorios.
*/


const columnas = 10;
const filas = 7;

const posiciones = [];


for (
    let f = 0;
    f < filas;
    f++
) {

    for (
        let c = 0;
        c < columnas;
        c++
    ) {

        posiciones.push({
            x:
                (c / columnas) * 100
                +
                (Math.random() * 7 - 3.5),

            y:
                8 +
                (f / filas) * 90
                +
                (Math.random() * 8 - 4)
        });

    }

}


/*
    Mezclamos las posiciones
    para que no parezca una cuadrícula.
*/

posiciones.sort(
    () => Math.random() - .5
);


/* =====================================================
   CREAR GIRASOLES
===================================================== */

for (
    let i = 0;
    i < cantidad;
    i++
) {

    const flor =
        document.createElement(
            "div"
        );


    flor.className =
        "girasol";


    /*
       Elegimos una posición
       previamente distribuida.
    */

    const pos =
        posiciones[
            i % posiciones.length
        ];


    /*
       Pequeña variación para evitar
       que los que compartan zona
       queden juntos.
    */

    const x =
        pos.x +
        (Math.random() * 5 - 2.5);


    const y =
        pos.y +
        (Math.random() * 5 - 2.5);


    /*
       Profundidad.

       Según la posición vertical,
       los de abajo son más grandes.
    */

    const profundidad =
        Math.min(
            1,
            Math.max(
                0,
                (y - 8) / 90
            )
        );


    /*
       Tamaño.

       Fondo:
       0.20

       Frente:
       0.75
    */

    const escala =
        .18 +
        profundidad * .62;


    /*
       Desenfoque.

       Más lejos = más niebla.
    */

    const blur =
        (1 - profundidad) * 1.6;


    /*
       Opacidad.
    */

    const opacity =
        .45 +
        profundidad * .5;


    flor.style.left =
        `${x}%`;

    flor.style.top =
        `${y}%`;

    flor.style.transform =
        `scale(${escala})`;

    flor.style.filter =
        `blur(${blur}px)`;

    flor.style.opacity =
        opacity;


    /*
       Variación de viento.
    */

    flor.style.animationDelay =
        `${Math.random() * -5}s`;


    /*
       Variación horizontal.
    */

    flor.style.marginLeft =
        `${Math.random() * 8 - 4}px`;


    campo.appendChild(
        flor
    );

}

</script>


</body>

</html>
