<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>🌻 Campo</title>


<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    background: #6fa9c3;
}


/* =====================================================
   ESCENA COMPLETA
===================================================== */

.escena {

    position: relative;

    width: 100vw;
    height: 100svh;

    overflow: hidden;

    background:
        linear-gradient(
            to bottom,

            #729fb5 0%,
            #a9c4cc 28%,
            #b9c9c5 43%,
            #789b5d 58%,
            #426d2d 100%
        );
}


/* =====================================================
   CIELO
===================================================== */

.cielo {

    position: absolute;

    inset: 0;

    pointer-events: none;
}


/* =====================================================
   NUBES
===================================================== */

.nube {

    position: absolute;

    width: 180px;
    height: 50px;

    background:
        rgba(255,255,255,.42);

    border-radius: 100px;

    filter: blur(4px);

    opacity: .7;
}


.nube::before,
.nube::after {

    content: "";

    position: absolute;

    background:
        rgba(255,255,255,.42);

    border-radius: 50%;
}


.nube::before {

    width: 80px;
    height: 80px;

    left: 20px;
    bottom: 5px;
}


.nube::after {

    width: 100px;
    height: 100px;

    right: 15px;
    bottom: 0;
}


.nube1 {

    top: 12%;
    left: -60px;

    transform: scale(.9);
}


.nube2 {

    top: 24%;
    right: -70px;

    transform: scale(.65);
}


.nube3 {

    top: 8%;
    left: 42%;

    transform: scale(.5);

    opacity: .35;
}


/* =====================================================
   SOL DIFUSO
===================================================== */

.sol {

    position: absolute;

    width: 95px;
    height: 95px;

    top: 7%;
    right: 13%;

    border-radius: 50%;

    background:
        rgba(255,222,113,.8);

    box-shadow:
        0 0 45px
        rgba(255,226,137,.55);

    filter: blur(1px);
}


/* =====================================================
   CAMPO
===================================================== */

.campo {

    position: absolute;

    left: -15%;
    right: -15%;

    bottom: -10%;

    height: 62%;

    background:

        linear-gradient(
            to bottom,
            #638f46 0%,
            #4c7e32 25%,
            #396927 65%,
            #28521e 100%
        );

    clip-path:

        polygon(
            0 28%,
            50% 0,
            100% 28%,
            100% 100%,
            0 100%
        );

    overflow: hidden;
}


/* =====================================================
   CAMINO / PERSPECTIVA CENTRAL
===================================================== */

.camino {

    position: absolute;

    left: 50%;
    bottom: -10%;

    width: 35%;
    height: 95%;

    transform:
        translateX(-50%);

    background:

        linear-gradient(
            to top,
            rgba(151,123,72,.8),
            rgba(177,153,101,.4),
            transparent
        );

    clip-path:

        polygon(
            38% 0,
            62% 0,
            100% 100%,
            0 100%
        );

    opacity: .25;
}


/* =====================================================
   CONTENEDOR DE GIRASOLES
===================================================== */

#campoGirasoles {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;
}


/* =====================================================
   GIRASOL
===================================================== */

.girasol {

    position: absolute;

    transform-origin:
        center bottom;

    pointer-events: none;

    animation:
        viento 5s ease-in-out infinite;

    z-index: 5;
}


/* =====================================================
   TALLO
===================================================== */

.tallo {

    position: absolute;

    bottom: 0;

    left: 50%;

    width: 6px;
    height: 100px;

    transform:
        translateX(-50%);

    border-radius: 10px;

    background:
        linear-gradient(
            to right,
            #285c20,
            #559536,
            #285c20
        );
}


/* =====================================================
   HOJAS
===================================================== */

.hoja {

    position: absolute;

    width: 42px;
    height: 18px;

    background:
        #4e9230;

    border-radius:
        100%
        0
        100%
        0;
}


.hoja.izquierda {

    left: -34px;
    top: 40px;

    transform:
        rotate(-28deg);
}


.hoja.derecha {

    right: -34px;
    top: 57px;

    transform:
        rotate(28deg)
        scaleX(-1);
}


/* =====================================================
   FLOR
===================================================== */

.flor {

    position: absolute;

    width: 60px;
    height: 60px;

    top: -5px;
    left: 50%;

    transform:
        translateX(-50%);
}


/* =====================================================
   PETALOS
===================================================== */

.petalo {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 24px;
    height: 38px;

    transform-origin:
        50% 100%;

    background:
        linear-gradient(
            to bottom,
            #ffe94a,
            #f1bd12
        );

    border-radius: 50%;
}


.petalo:nth-child(1) {
    transform:
        translate(-50%, -100%)
        rotate(0deg);
}

.petalo:nth-child(2) {
    transform:
        translate(-50%, -100%)
        rotate(45deg);
}

.petalo:nth-child(3) {
    transform:
        translate(-50%, -100%)
        rotate(90deg);
}

.petalo:nth-child(4) {
    transform:
        translate(-50%, -100%)
        rotate(135deg);
}

.petalo:nth-child(5) {
    transform:
        translate(-50%, -100%)
        rotate(180deg);
}

.petalo:nth-child(6) {
    transform:
        translate(-50%, -100%)
        rotate(225deg);
}

.petalo:nth-child(7) {
    transform:
        translate(-50%, -100%)
        rotate(270deg);
}

.petalo:nth-child(8) {
    transform:
        translate(-50%, -100%)
        rotate(315deg);
}


/* =====================================================
   CENTRO
===================================================== */

.centro {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 30px;
    height: 30px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #9b611c 0%,
            #60370d 75%
        );

    z-index: 5;
}


/* =====================================================
   NIEBLA DEL FONDO
===================================================== */

.niebla {

    position: absolute;

    left: 0;
    right: 0;

    top: 36%;

    height: 35%;

    background:

        linear-gradient(
            to bottom,

            rgba(220,229,220,.75),
            rgba(211,224,213,.40),
            rgba(211,224,213,0)
        );

    pointer-events: none;

    z-index: 20;

    filter: blur(5px);
}


/* =====================================================
   NIEBLA INFERIOR
===================================================== */

.nieblaCampo {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 20%;

    background:

        linear-gradient(
            to top,
            rgba(28,55,22,.25),
            transparent
        );

    pointer-events: none;

    z-index: 30;
}


/* =====================================================
   GIRASOL PRINCIPAL
===================================================== */

.actual {

    position: absolute;

    left: 50%;

    bottom: 10%;

    width: 170px;
    height: 280px;

    transform:
        translateX(-50%);

    z-index: 100;

    animation:
        vientoGrande 5s ease-in-out infinite;
}


/* Flor grande */

.actual .flor {

    width: 145px;
    height: 145px;

    top: -5px;
}


.actual .petalo {

    width: 54px;
    height: 78px;
}


.actual .centro {

    width: 66px;
    height: 66px;
}


.actual .tallo {

    width: 10px;
    height: 190px;
}


.actual .hoja {

    width: 70px;
    height: 30px;
}


.actual .hoja.izquierda {

    left: -58px;
    top: 95px;
}


.actual .hoja.derecha {

    right: -58px;
    top: 120px;
}


/* =====================================================
   NUMERO DEL DÍA
===================================================== */

.numero {

    position: absolute;

    left: 50%;

    top: -78px;

    transform:
        translateX(-50%);

    padding:
        10px 19px;

    border-radius: 30px;

    white-space: nowrap;

    background:
        rgba(255,255,255,.95);

    color:
        #674400;

    font-size: 20px;

    font-weight: bold;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.22);

    z-index: 200;
}


/* =====================================================
   SIGUIENTE GIRASOL
===================================================== */

.siguiente {

    position: absolute;

    left: calc(50% + 95px);

    bottom: 9%;

    width: 85px;
    height: 140px;

    z-index: 110;

    transform:
        scale(.65);

    animation:
        crecer 3s ease-in-out infinite;
}


.siguiente .flor {

    width: 55px;
    height: 55px;
}


.siguiente .petalo {

    width: 22px;
    height: 33px;
}


.siguiente .centro {

    width: 27px;
    height: 27px;
}


.siguiente .tallo {

    height: 95px;

    width: 6px;
}


/* =====================================================
   FRASE
===================================================== */

.frase {

    position: absolute;

    width: 230px;

    left: -75px;

    bottom: 130px;

    padding:
        14px 17px;

    background:
        rgba(255,255,255,.94);

    color:
        #624300;

    border-radius:
        16px;

    font-size: 15px;

    line-height: 1.4;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.18);

    text-align: center;
}


.frase strong {

    font-size: 17px;
}


/* =====================================================
   ANIMACIONES
===================================================== */

@keyframes viento {

    0%,
    100% {
        rotate: -1.5deg;
    }

    50% {
        rotate: 1.5deg;
    }
}


@keyframes vientoGrande {

    0%,
    100% {
        rotate: -1deg;
    }

    50% {
        rotate: 1deg;
    }
}


@keyframes crecer {

    0%,
    100% {
        scale: .62;
    }

    50% {
        scale: .72;
    }
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 380px) {

    .actual {

        transform:
            translateX(-50%)
            scale(.82);

        bottom: 8%;
    }

    .siguiente {

        left: calc(50% + 75px);

        bottom: 7%;
    }

    .frase {

        width: 205px;

        font-size: 14px;

        left: -70px;
    }

    .sol {

        width: 70px;
        height: 70px;
    }
}


@media (min-width: 700px) {

    .actual {

        transform:
            translateX(-50%)
            scale(1.15);

        bottom: 8%;
    }

    .siguiente {

        left: calc(50% + 150px);

        transform:
            scale(.8);
    }

    .frase {

        width: 270px;

        font-size: 17px;
    }
}

</style>

</head>


<body>


<div class="escena">


    <!-- CIELO -->

    <div class="cielo"></div>


    <!-- NUBES -->

    <div class="nube nube1"></div>

    <div class="nube nube2"></div>

    <div class="nube nube3"></div>


    <!-- SOL -->

    <div class="sol"></div>


    <!-- CAMPO -->

    <div class="campo">

        <div class="camino"></div>

        <div id="campoGirasoles"></div>

    </div>


    <!-- NIEBLA DEL HORIZONTE -->

    <div class="niebla"></div>

    <div class="nieblaCampo"></div>


    <!-- =========================================
         GIRASOL DEL DÍA ACTUAL
    ========================================== -->

    <div class="actual">

        <div
            class="numero"
            id="numeroDia">
        </div>


        <div class="flor">

            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>

            <div class="centro"></div>

        </div>


        <div class="tallo">

            <div class="hoja izquierda"></div>

            <div class="hoja derecha"></div>

        </div>

    </div>


    <!-- =========================================
         GIRASOL DEL DÍA SIGUIENTE
    ========================================== -->

    <div class="siguiente">

        <div class="frase">

            <strong id="diaSiguiente">
                🌱 Día 779
            </strong>

            <br><br>

            <span>
                ACA VA LA FRASE
            </span>

        </div>


        <div class="flor">

            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>

            <div class="centro"></div>

        </div>


        <div class="tallo"></div>

    </div>


</div>



<script>

/* =====================================================
   FECHAS
===================================================== */

const inicio =
    new Date("2024-08-04T00:00:00");

const hoy =
    new Date();


inicio.setHours(0,0,0,0);
hoy.setHours(0,0,0,0);


const diferencia =
    hoy - inicio;


const dias =
    Math.floor(
        diferencia /
        (1000 * 60 * 60 * 24)
    );


/* =====================================================
   TEXTOS
===================================================== */

document.getElementById(
    "numeroDia"
).textContent =
    `🌻 Día ${dias}`;


document.getElementById(
    "diaSiguiente"
).textContent =
    `🌱 Día ${dias + 1}`;


/* =====================================================
   CREAR EL CAMPO
===================================================== */

const campo =
    document.getElementById(
        "campoGirasoles"
    );


/*
   IMPORTANTE:

   No los colocamos en filas.

   Cada girasol recibe:

   - profundidad
   - posición horizontal
   - posición vertical
   - tamaño
   - desenfoque
   - opacidad

   Así se genera la sensación
   de un campo real.
*/


for (
    let dia = 1;
    dia <= dias;
    dia++
) {

    const flor =
        document.createElement("div");


    flor.className =
        "girasol";


    /*
       profundidad:

       0 = muy lejos
       1 = muy cerca
    */

    const profundidad =
        Math.random();


    /*
       Los girasoles del fondo
       aparecen cerca del horizonte.
    */

    const y =
        30 +
        profundidad * 63;


    /*
       Distribución horizontal.

       Agregamos cierta tendencia
       hacia el centro para que
       parezca perspectiva.
    */

    const x =
        Math.random() * 100;


    /*
       Tamaño según distancia.

       Lejanos = diminutos
       Cercanos = grandes
    */

    const escala =
        .12 +
        profundidad * .78;


    /*
       Los más cercanos quedan
       por delante de los lejanos.
    */

    const z =
        Math.floor(
            profundidad * 100
        );


    /*
       Desenfoque progresivo.

       El fondo queda más difuso.
    */

    const blur =
        Math.max(
            0,
            (0.45 - profundidad) * 3
        );


    /*
       Opacidad.

       Los lejanos se mezclan
       con la niebla.
    */

    const opacidad =
        .35 +
        profundidad * .65;


    flor.style.left =
        `${x}%`;

    flor.style.top =
        `${y}%`;

    flor.style.zIndex =
        z;

    flor.style.opacity =
        opacidad;

    flor.style.filter =
        `blur(${blur}px)`;

    flor.style.transform =
        `scale(${escala})`;


    /*
       Variación de tamaño del tallo
       según profundidad.
    */

    const altura =
        65 +
        profundidad * 65;


    flor.innerHTML = `

        <div class="flor">

            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>

            <div class="centro"></div>

        </div>


        <div
            class="tallo"
            style="
                height:${altura}px;
            "
        >

            <div class="hoja izquierda"></div>

            <div class="hoja derecha"></div>

        </div>
    `;


    /*
       Variación de viento.
    */

    flor.style.animationDelay =
        `${Math.random() * -5}s`;


    campo.appendChild(flor);
}

</script>


</body>
</html>
