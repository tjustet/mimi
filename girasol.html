<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Nuestro campo de girasoles 🌻</title>

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;

        font-family:
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

        background: #dce8ea;
    }

    body {
        touch-action: manipulation;
    }

    /* =========================================
       ESCENA
    ========================================= */

    .escena {
        position: relative;

        width: 100vw;
        height: 100vh;
        height: 100svh;

        overflow: hidden;
        isolation: isolate;

        background:
            linear-gradient(
                to bottom,
                #91c4db 0%,
                #b7d9e5 27%,
                #dae8e5 43%,
                #b8c99c 45%,
                #607841 100%
            );
    }



    /* =========================================
       CIELO
    ========================================= */

    .cielo {
        position: absolute;

        inset:
            0
            0
            52%
            0;

        overflow: hidden;

        z-index: 0;
    }

    .sol {
        position: absolute;

        width: 68px;
        height: 68px;

        top: 7%;
        right: 10%;

        border-radius: 50%;

        background:
            radial-gradient(
                circle,
                rgba(255, 244, 186, .95) 0%,
                rgba(255, 232, 151, .75) 42%,
                rgba(255, 233, 163, .18) 70%,
                transparent 100%
            );

        filter: blur(1px);

        opacity: .9;
    }

    .sol::after {
        content: "";

        position: absolute;

        inset: -35px;

        border-radius: 50%;

        background:
            radial-gradient(
                circle,
                rgba(255,255,210,.25),
                transparent 70%
            );
    }



    /* =========================================
       NUBES
    ========================================= */

    .nube {
        position: absolute;

        border-radius: 999px;

        background:
            rgba(255,255,255,.24);

        filter: blur(8px);

        animation:
            moverNube
            45s
            linear
            infinite;
    }

    .nube1 {
        width: 160px;
        height: 30px;

        top: 16%;
        left: -30px;
    }

    .nube2 {
        width: 220px;
        height: 38px;

        top: 29%;
        left: 55%;

        opacity: .65;

        animation-duration: 62s;
    }

    .nube3 {
        width: 120px;
        height: 25px;

        top: 7%;
        left: 28%;

        opacity: .35;

        animation-duration: 55s;
    }

    @keyframes moverNube {

        0% {
            transform:
                translateX(-40px);
        }

        50% {
            transform:
                translateX(50px);
        }

        100% {
            transform:
                translateX(-40px);
        }

    }



    /* =========================================
       CAMPO
    ========================================= */

    .campo {
        position: absolute;

        left: 0;
        right: 0;
        bottom: 0;

        height: 60%;

        background:
            linear-gradient(
                to bottom,
                rgba(142,151,91,.8) 0%,
                #7c934d 15%,
                #5e793d 46%,
                #405f31 100%
            );

        clip-path:
            polygon(
                0 3%,
                15% 1%,
                33% 3.5%,
                50% 0%,
                68% 2.7%,
                85% 1%,
                100% 3%,
                100% 100%,
                0 100%
            );

        z-index: 2;
    }

    #campoCanvas {
        position: absolute;

        inset: 0;

        width: 100%;
        height: 100%;

        pointer-events: none;
    }



    /* =========================================
       NIEBLA DEL HORIZONTE
    ========================================= */

    .niebla {
        position: absolute;

        left: 0;
        top: -3%;

        width: 100%;
        height: 38%;

        pointer-events: none;

        background:
            linear-gradient(
                to bottom,
                rgba(222,231,215,.55) 0%,
                rgba(218,227,205,.28) 30%,
                rgba(220,229,207,.08) 63%,
                transparent 100%
            );

        filter: blur(2px);

        z-index: 3;
    }

    .bruma {
        position: absolute;

        left: -10%;
        top: 4%;

        width: 120%;
        height: 18%;

        background:
            rgba(228,232,215,.12);

        filter: blur(18px);

        pointer-events: none;

        z-index: 4;
    }



    /* =========================================
       GIRASOL PRINCIPAL
    ========================================= */

    .girasol {
        position: absolute;

        width: 65px;
        height: 155px;

        transform-origin:
            bottom center;

        pointer-events: none;
    }



    /* =========================================
       TALLO
    ========================================= */

    .tallo {
        position: absolute;

        width: 7px;
        height: 105px;

        bottom: 0;
        left: 50%;

        transform:
            translateX(-50%);

        border-radius: 6px;

        background:
            linear-gradient(
                90deg,
                #365f29,
                #659042 48%,
                #315623
            );
    }



    /* =========================================
       HOJAS CORREGIDAS
    ========================================= */

    .hoja {
        position: absolute;

        width: 40px;
        height: 24px;

        bottom: 48px;

        background:
            linear-gradient(
                135deg,
                #76994d 0%,
                #4f7937 50%,
                #315a29 100%
            );

        box-shadow:
            inset -3px -2px 5px
            rgba(25,65,25,.15);

        transform-origin:
            0% 50%;
    }

    .hoja::after {
        content: "";

        position: absolute;

        left: 4px;
        top: 50%;

        width: 78%;
        height: 1px;

        background:
            rgba(220,235,180,.28);

        transform-origin:
            left center;
    }

    /* Hoja izquierda */

    .hoja.izq {
        left: 50%;

        margin-left: -4px;

        border-radius:
            80% 10%
            80% 10%;

        transform:
            rotate(155deg)
            skewX(-8deg);
    }

    /* Hoja derecha */

    .hoja.der {
        left: 50%;
        right: auto;

        bottom: 69px;

        margin-left: 2px;

        border-radius:
            10% 80%
            10% 80%;

        transform:
            rotate(24deg)
            skewX(8deg);
    }



    /* =========================================
       FLOR
    ========================================= */

    .flor {
        position: absolute;

        width: 72px;
        height: 72px;

        top: 0;
        left: 50%;

        transform:
            translateX(-50%);

        transform-origin:
            50% 85%;

        animation:
            brisaFlor
            4.6s
            ease-in-out
            infinite
            alternate;
    }



    /* =========================================
       PÉTALOS
    ========================================= */

    .petalo {
        position: absolute;

        width: 31px;
        height: 46px;

        left: 50%;
        top: 50%;

        margin-left: -15.5px;
        margin-top: -40px;

        transform-origin:
            50% 40px;

        border-radius:
            70% 70%
            47% 47%;

        background:
            linear-gradient(
                to bottom,
                #ffd83a 0%,
                #f4b51f 58%,
                #d89916 100%
            );

        box-shadow:
            inset 0 -4px 8px
            rgba(130,75,0,.14);
    }

    .petalo:nth-child(1) {
        transform: rotate(0deg);
    }

    .petalo:nth-child(2) {
        transform: rotate(45deg);
    }

    .petalo:nth-child(3) {
        transform: rotate(90deg);
    }

    .petalo:nth-child(4) {
        transform: rotate(135deg);
    }

    .petalo:nth-child(5) {
        transform: rotate(180deg);
    }

    .petalo:nth-child(6) {
        transform: rotate(225deg);
    }

    .petalo:nth-child(7) {
        transform: rotate(270deg);
    }

    .petalo:nth-child(8) {
        transform: rotate(315deg);
    }



    /* =========================================
       CENTRO DEL GIRASOL
    ========================================= */

    .centro {
        position: absolute;

        width: 36px;
        height: 36px;

        left: 50%;
        top: 50%;

        transform:
            translate(
                -50%,
                -50%
            );

        border-radius: 50%;

        background:
            radial-gradient(
                circle at 35% 30%,
                #745229 0%,
                #4a321c 42%,
                #2a1c12 76%,
                #1b130c 100%
            );

        box-shadow:
            inset 0 0 8px
            rgba(0,0,0,.4),

            0 2px 4px
            rgba(0,0,0,.15);
    }



    /* =========================================
       MOVIMIENTO FLOR
    ========================================= */

    @keyframes brisaFlor {

        from {
            transform:
                translateX(-50%)
                rotate(-2deg);
        }

        to {
            transform:
                translateX(-50%)
                rotate(2.5deg);
        }

    }



    /* =========================================
       GIRASOL DEL DÍA ACTUAL
    ========================================= */

    .actual {
        width: 170px;
        height: 300px;

        left: 45%;
        bottom: 1%;

        transform:
            translateX(-50%);

        z-index: 20;
    }

    .actual .tallo {
        width: 10px;
        height: 190px;
    }

    .actual .hoja {
        width: 73px;
        height: 42px;

        bottom: 63px;
    }

    .actual .hoja.izq {
        margin-left: -7px;

        transform:
            rotate(158deg)
            skewX(-7deg);
    }

    .actual .hoja.der {
        bottom: 108px;

        margin-left: 4px;

        transform:
            rotate(22deg)
            skewX(7deg);
    }

    .actual .flor {
        width: 145px;
        height: 145px;
    }

    .actual .petalo {
        width: 56px;
        height: 80px;

        margin-left: -28px;
        margin-top: -68px;

        transform-origin:
            50% 68px;
    }

    .actual .centro {
        width: 67px;
        height: 67px;

        background:
            radial-gradient(
                circle at 35% 30%,
                #80602f 0%,
                #50331a 40%,
                #28180c 73%,
                #171008 100%
            );
    }



    /* =========================================
       CONTADOR DEL DÍA
    ========================================= */

    .actual .numero {
        position: absolute;

        left: 50%;
        top: -79px;

        transform:
            translateX(-50%);

        white-space: nowrap;

        padding:
            9px
            15px;

        border-radius: 18px;

        background:
            rgba(255,255,255,.88);

        color:
            #41311d;

        font-weight: 750;
        font-size: 14px;

        box-shadow:
            0 5px 18px
            rgba(37,45,25,.15);

        backdrop-filter:
            blur(7px);
    }



    /* =========================================
       GIRASOL DEL PRÓXIMO DÍA
    ========================================= */

    .siguiente {
        width: 70px;
        height: 155px;

        left:
            calc(
                45% + 101px
            );

        bottom: 1.5%;

        z-index: 19;
    }

    .siguiente .tallo {
        width: 6px;
        height: 95px;
    }

    .siguiente .hoja {
        width: 35px;
        height: 20px;

        bottom: 38px;
    }

    .siguiente .hoja.izq {
        transform:
            rotate(155deg)
            skewX(-7deg);
    }

    .siguiente .hoja.der {
        bottom: 60px;

        transform:
            rotate(24deg)
            skewX(7deg);
    }

    .siguiente .flor {
        width: 55px;
        height: 55px;

        top: 8px;
    }

    .siguiente .petalo {
        width: 23px;
        height: 34px;

        margin-left: -11.5px;
        margin-top: -29px;

        transform-origin:
            50% 29px;
    }

    .siguiente .centro {
        width: 28px;
        height: 28px;
    }



    /* =========================================
       FRASE
    ========================================= */

    .frase {
        position: absolute;

        width:
            min(
                240px,
                64vw
            );

        bottom: 142px;
        left: 50%;

        transform:
            translateX(-50%);

        padding:
            11px
            14px;

        text-align: center;

        background:
            rgba(255,255,255,.86);

        border:
            1px solid
            rgba(255,255,255,.65);

        border-radius: 18px;

        box-shadow:
            0 6px 22px
            rgba(30,45,20,.16);

        backdrop-filter:
            blur(9px);

        color:
            #4f472d;

        pointer-events: auto;
    }

    .frase .dia {
        margin-bottom: 4px;

        font-size: 11px;
        font-weight: 800;

        color:
            #6b7047;

        opacity: .8;
    }

    #textoFrase {
        min-height: 20px;

        outline: none;

        cursor: text;

        font-size: 13px;
        line-height: 1.4;

        font-weight: 500;
    }

    #textoFrase:empty::before {
        content:
            "Tocá acá para escribir algo 💛";

        opacity: .5;
    }



    /* =========================================
       SOMBRA
    ========================================= */

    .sombra-actual {
        position: absolute;

        bottom: 0;
        left: 45%;

        width: 175px;
        height: 34px;

        transform:
            translateX(-50%)
            translateY(45%);

        border-radius: 50%;

        background:
            rgba(21,40,17,.24);

        filter:
            blur(12px);

        z-index: 15;
    }



    /* =========================================
       TÍTULO
    ========================================= */

    .titulo {
        position: absolute;

        left: 18px;

        top:
            max(
                18px,
                env(safe-area-inset-top)
            );

        z-index: 8;

        color:
            rgba(42,53,43,.88);

        text-shadow:
            0 1px 8px
            rgba(255,255,255,.4);

        pointer-events: none;
    }

    .titulo h1 {
        margin: 0;

        font-size:
            clamp(
                18px,
                5vw,
                25px
            );

        letter-spacing: -.7px;

        font-weight: 750;
    }

    .titulo p {
        margin:
            2px 0 0;

        font-size: 11px;

        opacity: .65;
    }



    /* =========================================
       CELULARES CHICOS
    ========================================= */

    @media (
        max-width: 390px
    ) {

        .actual {
            left: 42%;

            transform:
                translateX(-50%)
                scale(.88);

            transform-origin:
                bottom center;
        }

        .sombra-actual {
            left: 42%;
        }

        .siguiente {
            left:
                calc(
                    42% + 87px
                );

            transform:
                scale(.9);

            transform-origin:
                bottom center;
        }

        .frase {
            width: 195px;

            left: 30%;
        }

    }



    /* =========================================
       PANTALLAS BAJAS
    ========================================= */

    @media (
        max-height: 680px
    ) {

        .actual {
            transform:
                translateX(-50%)
                scale(.8);

            transform-origin:
                bottom center;
        }

        .siguiente {
            transform:
                scale(.82);

            transform-origin:
                bottom center;
        }

        .titulo p {
            display: none;
        }

    }

</style>
</head>

<body>

<div class="escena">

    <!-- CIELO -->
    <div class="cielo">

        <div class="sol"></div>

        <div class="nube nube1"></div>
        <div class="nube nube2"></div>
        <div class="nube nube3"></div>

    </div>


    <!-- TEXTO SUPERIOR -->
    <div class="titulo">

        <h1>
            Nuestro campo 🌻
        </h1>

        <p id="subtitulo"></p>

    </div>


    <!-- CAMPO -->
    <div class="campo">

        <canvas id="campoCanvas"></canvas>

        <div class="niebla"></div>

        <div class="bruma"></div>

        <div class="sombra-actual"></div>


        <!-- ==================================
             GIRASOL DEL DÍA ACTUAL
        =================================== -->

        <div class="girasol actual">

            <div
                class="numero"
                id="numeroDia"
            >
                Día
            </div>

            <div class="tallo"></div>

            <div class="hoja izq"></div>

            <div class="hoja der"></div>

            <div class="flor">

                <div class="petalo"></div>
                <div class="petalo"></div>
                <div class="petalo"></div>
                <div class="petalo"></div>

                <div class="petalo"></div>
                <div class="petalo"></div>
                <div class="petalo"></div>
                <div class="petalo"></div>

                <div class="centro"></div>

            </div>

        </div>



        <!-- ==================================
             GIRASOL DEL PRÓXIMO DÍA
        =================================== -->

        <div class="girasol siguiente">

            <div class="frase">

                <div
                    class="dia"
                    id="diaSiguiente"
                ></div>

                <div
                    id="textoFrase"
                    contenteditable="true"
                    spellcheck="false"
                ></div>

            </div>

            <div class="tallo"></div>

            <div class="hoja izq"></div>

            <div class="hoja der"></div>

            <div class="flor">

                <div class="petalo"></div>
                <div class="petalo"></div>
                <div class="petalo"></div>
                <div class="petalo"></div>

                <div class="petalo"></div>
                <div class="petalo"></div>
                <div class="petalo"></div>
                <div class="petalo"></div>

                <div class="centro"></div>

            </div>

        </div>

    </div>

</div>



<script>

/* ==========================================
   FECHA INICIAL
========================================== */

const fechaInicio =
    new Date(
        2024,
        7,
        4
    );

const hoy =
    new Date();

const inicioDia =
    new Date(
        fechaInicio.getFullYear(),
        fechaInicio.getMonth(),
        fechaInicio.getDate()
    );

const hoyDia =
    new Date(
        hoy.getFullYear(),
        hoy.getMonth(),
        hoy.getDate()
    );

const MS_DIA =
    1000 *
    60 *
    60 *
    24;

const dias =
    Math.floor(
        (
            hoyDia -
            inicioDia
        ) /
        MS_DIA
    );



/* ==========================================
   TEXTOS
========================================== */

document
    .getElementById(
        "numeroDia"
    )
    .textContent =
    `🌻 Día ${dias}`;


document
    .getElementById(
        "diaSiguiente"
    )
    .textContent =
    `🌱 Nuestro próximo día · ${dias + 1}`;


document
    .getElementById(
        "subtitulo"
    )
    .textContent =
    `Desde el 4 de agosto de 2024 · ${dias} días`;



/* ==========================================
   FRASE
========================================== */

const textoFrase =
    document
        .getElementById(
            "textoFrase"
        );

const CLAVE_FRASE =
    `frase-dia-${dias + 1}`;


const FRASE_DEFECTO =
    "Todavía nos quedan muchos días por florecer juntos. 🌻💛";


textoFrase.textContent =
    localStorage
        .getItem(
            CLAVE_FRASE
        )
    ||
    FRASE_DEFECTO;


/*
    Guardamos cualquier cambio
    que hagas tocando la frase.
*/

textoFrase
    .addEventListener(
        "input",
        () => {

            localStorage
                .setItem(
                    CLAVE_FRASE,
                    textoFrase
                        .textContent
                        .trim()
                );

        }
    );



/* ==========================================
   CANVAS
========================================== */

const canvas =
    document
        .getElementById(
            "campoCanvas"
        );

const ctx =
    canvas
        .getContext(
            "2d"
        );

let flores = [];



/* ==========================================
   RANDOM DETERMINISTA

   Mantiene el mismo campo al recargar.
========================================== */

function randomSemilla(seed) {

    let value =
        seed %
        2147483647;

    if (
        value <= 0
    ) {

        value +=
            2147483646;

    }

    return function() {

        value =
            value *
            16807 %
            2147483647;

        return (
            value - 1
        ) /
        2147483646;

    };

}



/* ==========================================
   GENERAR CAMPO DE GIRASOLES
========================================== */

function generarCampo(
    width,
    height,
    cantidad
) {

    const random =
        randomSemilla(
            4082024
        );

    const elementos =
        [];

    let intentos =
        0;


    while (
        elementos.length <
        cantidad
        &&
        intentos <
        cantidad * 40
    ) {

        intentos++;


        /*
            Profundidad:
            0 = horizonte
            1 = cerca
        */

        const profundidad =
            Math.pow(
                random(),
                1.65
            );


        const y =
            height *
            (
                .05 +
                profundidad *
                .92
            );


        /*
            Abrimos el campo a medida
            que se acerca a nosotros.
        */

        const apertura =
            .69 +
            profundidad *
            .40;


        const centro =
            width /
            2;


        const xNormal =
            random() *
            2 -
            1;


        let x =
            centro +
            xNormal *
            (
                width /
                2
            ) *
            apertura;


        x +=
            (
                random() -
                .5
            ) *
            18;


        /*
            Tamaño.
        */

        const escala =
            .15 +
            profundidad *
            .83;


        /*
            Separación.
        */

        const distanciaMin =
            5 +
            profundidad *
            18;


        let demasiadoCerca =
            false;


        for (
            let i =
                elementos.length - 1;

            i >= 0;

            i--
        ) {

            const otra =
                elementos[i];


            if (
                Math.abs(
                    otra.y -
                    y
                ) >
                distanciaMin *
                1.8
            ) {

                continue;

            }


            const dx =
                otra.x -
                x;


            const dy =
                otra.y -
                y;


            const distancia =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            const minimo =
                distanciaMin *
                Math.max(
                    escala,
                    otra.escala
                );


            if (
                distancia <
                minimo *
                3
            ) {

                demasiadoCerca =
                    true;

                break;

            }

        }


        if (
            demasiadoCerca
        ) {

            continue;

        }


        elementos.push({

            x,

            y,

            escala,

            profundidad,

            rotacion:
                (
                    random() -
                    .5
                ) *
                .20,

            variacion:
                random(),

            inclinacion:
                (
                    random() -
                    .5
                ) *
                7

        });

    }


    /*
        Ordenamos de atrás
        hacia adelante.
    */

    elementos.sort(
        (
            a,
            b
        ) =>
            a.profundidad -
            b.profundidad
    );


    return elementos;

}



/* ==========================================
   GIRASOL CANVAS
========================================== */

function dibujarGirasol(
    flor,
    tiempo
) {

    const {
        x,
        y,
        escala,
        profundidad,
        rotacion,
        variacion,
        inclinacion
    } =
        flor;


    ctx.save();


    ctx.translate(
        x,
        y
    );


    ctx.scale(
        escala,
        escala
    );


    /*
        Movimiento suave.
    */

    const viento =
        Math.sin(
            tiempo *
            .0012 +
            variacion *
            8
        ) *
        (
            .014 +
            profundidad *
            .015
        );


    ctx.rotate(
        rotacion +
        viento
    );


    /*
        Flores lejanas menos contrastadas.
    */

    ctx.globalAlpha =
        .38 +
        profundidad *
        .62;



    /* ======================================
       TALLO
    ====================================== */

    const altoTallo =
        49 +
        profundidad *
        28;


    ctx.beginPath();


    ctx.moveTo(
        0,
        2
    );


    ctx.quadraticCurveTo(
        inclinacion,
        altoTallo /
        2,
        0,
        altoTallo
    );


    ctx.lineWidth =
        3.2 +
        profundidad *
        1.7;


    ctx.lineCap =
        "round";


    ctx.strokeStyle =
        profundidad <
        .25
            ?
            "#66804b"
            :
            "#3d682e";


    ctx.stroke();



    /* ======================================
       HOJAS CANVAS
    ====================================== */

    function hoja(
        lado,
        altura,
        tamaño
    ) {

        ctx.save();


        ctx.translate(
            0,
            altura
        );


        ctx.scale(
            lado,
            1
        );


        ctx.rotate(
            -.15
        );


        ctx.beginPath();


        ctx.moveTo(
            0,
            0
        );


        ctx.bezierCurveTo(
            tamaño *
            .4,

            -tamaño *
            .55,

            tamaño,

            -tamaño *
            .5,

            tamaño,

            0
        );


        ctx.bezierCurveTo(
            tamaño *
            .72,

            tamaño *
            .42,

            tamaño *
            .22,

            tamaño *
            .32,

            0,

            0
        );


        ctx.fillStyle =
            profundidad <
            .25
                ?
                "#758952"
                :
                "#4e7533";


        ctx.fill();


        ctx.restore();

    }


    hoja(
        -1,
        altoTallo *
        .61,
        17
    );


    hoja(
        1,
        altoTallo *
        .43,
        15
    );



    /* ======================================
       FLOR
    ====================================== */

    ctx.translate(
        0,
        -3
    );


    const tamañoFlor =
        19 +
        profundidad *
        16;



    /* ======================================
       PÉTALOS
    ====================================== */

    for (
        let i = 0;
        i < 10;
        i++
    ) {

        const angulo =
            (
                Math.PI *
                2 /
                10
            ) *
            i;


        ctx.save();


        ctx.rotate(
            angulo
        );


        ctx.translate(
            0,
            -tamañoFlor *
            .58
        );


        ctx.beginPath();


        ctx.ellipse(
            0,
            0,

            tamañoFlor *
            .23,

            tamañoFlor *
            .54,

            0,

            0,

            Math.PI *
            2
        );


        ctx.fillStyle =
            profundidad <
            .22
                ?
                "#d8b843"
                :
                (
                    variacion >
                    .45

                    ?

                    "#f2c52b"

                    :

                    "#eab522"
                );


        ctx.fill();


        ctx.restore();

    }



    /* ======================================
       CENTRO
    ====================================== */

    const radio =
        tamañoFlor *
        .34;


    const degradado =
        ctx.createRadialGradient(

            -radio *
            .25,

            -radio *
            .25,

            1,

            0,

            0,

            radio

        );


    degradado
        .addColorStop(
            0,
            "#75502c"
        );


    degradado
        .addColorStop(
            .55,
            "#4d321c"
        );


    degradado
        .addColorStop(
            1,
            "#281a10"
        );


    ctx.beginPath();


    ctx.arc(
        0,
        0,
        radio,
        0,
        Math.PI *
        2
    );


    ctx.fillStyle =
        degradado;


    ctx.fill();


    ctx.restore();

}



/* ==========================================
   PASTO DELANTERO
========================================== */

function dibujarPasto(
    width,
    height
) {

    const random =
        randomSemilla(
            197
        );


    ctx.save();


    ctx.globalAlpha =
        .32;


    for (
        let i = 0;
        i < 90;
        i++
    ) {

        const x =
            random() *
            width;


        const y =
            height *
            (
                .75 +
                random() *
                .25
            );


        const alto =
            7 +
            random() *
            20;


        ctx.beginPath();


        ctx.moveTo(
            x,
            y
        );


        ctx.quadraticCurveTo(

            x +
            (
                random() -
                .5
            ) *
            8,

            y -
            alto /
            2,

            x +
            (
                random() -
                .5
            ) *
            10,

            y -
            alto

        );


        ctx.lineWidth =
            .8 +
            random() *
            1.6;


        ctx.strokeStyle =
            "#294b29";


        ctx.stroke();

    }


    ctx.restore();

}



/* ==========================================
   PREPARAR CANVAS
========================================== */

function prepararCanvas() {

    const rect =
        canvas
            .getBoundingClientRect();


    const dpr =
        Math.min(
            window.devicePixelRatio ||
            1,

            2
        );


    canvas.width =
        rect.width *
        dpr;


    canvas.height =
        rect.height *
        dpr;


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    /*
        Un girasol cada dos días.
    */

    const cantidad =
        Math.max(
            1,
            Math.floor(
                dias /
                2
            )
        );


    flores =
        generarCampo(
            rect.width,
            rect.height,
            cantidad
        );

}



/* ==========================================
   ANIMACIÓN
========================================== */

let ultimoFrame =
    0;


function animar(
    tiempo
) {

    /*
        Aproximadamente 30 FPS.
        Mejor para celulares.
    */

    if (
        tiempo -
        ultimoFrame <
        33
    ) {

        requestAnimationFrame(
            animar
        );

        return;

    }


    ultimoFrame =
        tiempo;


    const rect =
        canvas
            .getBoundingClientRect();


    ctx.clearRect(
        0,
        0,
        rect.width,
        rect.height
    );



    /* ======================================
       LUZ DEL HORIZONTE
    ====================================== */

    const brillo =
        ctx.createLinearGradient(
            0,
            0,
            0,
            rect.height
        );


    brillo
        .addColorStop(
            0,
            "rgba(225,228,188,.12)"
        );


    brillo
        .addColorStop(
            .4,
            "rgba(255,255,255,0)"
        );


    ctx.fillStyle =
        brillo;


    ctx.fillRect(
        0,
        0,
        rect.width,
        rect.height
    );



    /* ======================================
       GIRASOLES
    ====================================== */

    for (
        const flor
        of flores
    ) {

        dibujarGirasol(
            flor,
            tiempo
        );

    }



    /* ======================================
       PASTO
    ====================================== */

    dibujarPasto(
        rect.width,
        rect.height
    );


    requestAnimationFrame(
        animar
    );

}



/* ==========================================
   INICIAR
========================================== */

prepararCanvas();

requestAnimationFrame(
    animar
);



/* ==========================================
   REDIMENSIONAR
========================================== */

let resizeTimer;


window
    .addEventListener(
        "resize",
        () => {

            clearTimeout(
                resizeTimer
            );


            resizeTimer =
                setTimeout(
                    prepararCanvas,
                    120
                );

        }
    );

</script>
