<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>🌻 Nuestro campo</title>


<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

}

body {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

}


/* =====================================================
   ESCENA
===================================================== */

.escena {

    position: relative;

    width: 100vw;
    height: 100svh;

    overflow: hidden;

    background:

        linear-gradient(
            to bottom,

            #709eb5 0%,
            #a9c5ca 28%,
            #cbd4ce 43%,
            #809f63 54%,
            #56843a 68%,
            #396a28 100%
        );

}


/* =====================================================
   SOL
===================================================== */

.sol {

    position: absolute;

    width: 90px;
    height: 90px;

    top: 7%;
    right: 12%;

    border-radius: 50%;

    background:
        rgba(255,222,110,.72);

    box-shadow:
        0 0 45px
        rgba(255,230,140,.5);

}


/* =====================================================
   NUBES
===================================================== */

.nube {

    position: absolute;

    width: 175px;
    height: 48px;

    background:
        rgba(255,255,255,.43);

    border-radius: 50px;

    filter: blur(5px);

    opacity: .8;

}

.nube::before,
.nube::after {

    content: "";

    position: absolute;

    background:
        rgba(255,255,255,.43);

    border-radius: 50%;

}

.nube::before {

    width: 70px;
    height: 70px;

    left: 20px;
    bottom: 5px;

}

.nube::after {

    width: 90px;
    height: 90px;

    right: 20px;
    bottom: 0;

}

.nube1 {

    top: 10%;
    left: -70px;

}

.nube2 {

    top: 22%;
    right: -75px;

    transform:
        scale(.7);

}

.nube3 {

    top: 15%;
    left: 38%;

    transform:
        scale(.45);

    opacity: .3;

}


/* =====================================================
   CAMPO
===================================================== */

.campo {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 59%;

    overflow: hidden;

    background:

        linear-gradient(
            to bottom,

            #73954d 0%,
            #5f8b3d 22%,
            #4b7b31 45%,
            #3c6b28 72%,
            #2e5720 100%
        );

}


/* =====================================================
   CAMPO CON PERSPECTIVA
===================================================== */

.campo::before {

    content: "";

    position: absolute;

    left: -20%;
    right: -20%;

    top: 5%;

    height: 100%;

    background:

        linear-gradient(
            100deg,
            rgba(255,255,255,.05),
            transparent 30%,
            rgba(255,255,255,.06) 60%,
            transparent
        );

    transform:
        perspective(500px)
        rotateX(35deg);

    opacity: .7;

}


/* =====================================================
   GIRASOLES DEL CAMPO
===================================================== */

#girasoles {

    position: absolute;

    inset: 0;

}


/*
   ESTE ES EL MISMO ESTILO
   DE GIRASOL QUE TE GUSTABA
*/

.girasol {

    position: absolute;

    width: 65px;
    height: 155px;

    transform-origin:
        bottom center;

    animation:
        viento 5s ease-in-out infinite;

}


/* =====================================================
   TALLO
===================================================== */

.tallo {

    position: absolute;

    left: 50%;
    bottom: 0;

    width: 7px;
    height: 105px;

    transform:
        translateX(-50%);

    border-radius: 10px;

    background:

        linear-gradient(
            to right,

            #24551c,
            #57983a,
            #24551c
        );

}


/* =====================================================
   HOJAS
===================================================== */

.hoja {

    position: absolute;

    width: 48px;
    height: 21px;

    background:
        #4b9130;

    border-radius:
        100%
        0
        100%
        0;

}

.hoja.izq {

    left: -39px;
    top: 43px;

    transform:
        rotate(-25deg);

}

.hoja.der {

    right: -39px;
    top: 61px;

    transform:
        rotate(25deg)
        scaleX(-1);

}


/* =====================================================
   FLOR
===================================================== */

.flor {

    position: absolute;

    width: 72px;
    height: 72px;

    left: 50%;
    top: -5px;

    transform:
        translateX(-50%);

}


/* =====================================================
   PÉTALOS
===================================================== */

.petalo {

    position: absolute;

    width: 31px;
    height: 46px;

    left: 50%;
    top: 50%;

    transform-origin:
        center bottom;

    background:

        linear-gradient(
            to bottom,

            #ffe94a,
            #f2bf13
        );

    border-radius:
        50%;

}


/* 8 pétalos */

.petalo:nth-child(1) {

    transform:
        translate(-50%, -100%)
        rotate(0deg);

}

.petalo:nth-child(2) {

    transform:
        translate(-50%, -100%)
        rotate(45deg);

}

.petalo:nth-child(3) {

    transform:
        translate(-50%, -100%)
        rotate(90deg);

}

.petalo:nth-child(4) {

    transform:
        translate(-50%, -100%)
        rotate(135deg);

}

.petalo:nth-child(5) {

    transform:
        translate(-50%, -100%)
        rotate(180deg);

}

.petalo:nth-child(6) {

    transform:
        translate(-50%, -100%)
        rotate(225deg);

}

.petalo:nth-child(7) {

    transform:
        translate(-50%, -100%)
        rotate(270deg);

}

.petalo:nth-child(8) {

    transform:
        translate(-50%, -100%)
        rotate(315deg);

}


/* =====================================================
   CENTRO
===================================================== */

.centro {

    position: absolute;

    width: 36px;
    height: 36px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:

        radial-gradient(
            circle,

            #9b5d18 0%,
            #65370b 75%
        );

    z-index: 5;

}


/* =====================================================
   NIEBLA DEL HORIZONTE
===================================================== */

.niebla {

    position: absolute;

    left: -10%;
    right: -10%;

    top: 34%;

    height: 28%;

    background:

        linear-gradient(
            to bottom,

            rgba(221,230,222,.82),
            rgba(215,226,217,.48),
            rgba(215,226,217,.12),
            transparent
        );

    filter:
        blur(7px);

    pointer-events:
        none;

    z-index:
        500;

}


/* =====================================================
   GIRASOL PRINCIPAL
===================================================== */

.actual {

    position: absolute;

    left: 50%;
    bottom: 7%;

    width: 175px;
    height: 285px;

    transform:
        translateX(-50%);

    z-index: 1000;

    animation:
        vientoGrande 5s ease-in-out infinite;

}


/* Flor */

.actual .flor {

    width: 145px;
    height: 145px;

    top: -5px;

}


/* Pétalos grandes */

.actual .petalo {

    width: 56px;
    height: 80px;

}


/* Centro */

.actual .centro {

    width: 66px;
    height: 66px;

}


/* Tallo */

.actual .tallo {

    width: 10px;
    height: 190px;

}


/* Hojas */

.actual .hoja {

    width: 72px;
    height: 31px;

}

.actual .hoja.izq {

    left: -59px;
    top: 96px;

}

.actual .hoja.der {

    right: -59px;
    top: 121px;

}


/* =====================================================
   NÚMERO
===================================================== */

.numero {

    position: absolute;

    left: 50%;
    top: -76px;

    transform:
        translateX(-50%);

    padding:
        10px 19px;

    background:
        rgba(255,255,255,.96);

    color:
        #654200;

    border-radius:
        30px;

    white-space:
        nowrap;

    font-size:
        20px;

    font-weight:
        bold;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.22);

    z-index:
        100;

}


/* =====================================================
   SIGUIENTE DÍA
===================================================== */

.siguiente {

    position: absolute;

    left:
        calc(50% + 95px);

    bottom:
        7%;

    width:
        80px;

    height:
        145px;

    z-index:
        1100;

    animation:
        crecer 3s ease-in-out infinite;

}


/* Flor siguiente */

.siguiente .flor {

    width:
        55px;

    height:
        55px;

    top:
        0;

}


/* Pétalos */

.siguiente .petalo {

    width:
        23px;

    height:
        34px;

}


/* Centro */

.siguiente .centro {

    width:
        28px;

    height:
        28px;

}


/* Tallo */

.siguiente .tallo {

    height:
        95px;

    width:
        6px;

}


/* =====================================================
   FRASE
===================================================== */

.frase {

    position: absolute;

    width:
        225px;

    left:
        -78px;

    bottom:
        135px;

    padding:
        14px 17px;

    background:
        rgba(255,255,255,.95);

    color:
        #624300;

    border-radius:
        16px;

    text-align:
        center;

    font-size:
        15px;

    line-height:
        1.45;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.18);

}


.frase strong {

    font-size:
        17px;

}


/* =====================================================
   ANIMACIONES
===================================================== */

@keyframes viento {

    0%,
    100% {

        rotate:
            -1.2deg;

    }

    50% {

        rotate:
            1.2deg;

    }

}


@keyframes vientoGrande {

    0%,
    100% {

        rotate:
            -.8deg;

    }

    50% {

        rotate:
            .8deg;

    }

}


@keyframes crecer {

    0%,
    100% {

        scale:
            .94;

    }

    50% {

        scale:
            1.05;

    }

}


/* =====================================================
   CELULARES MUY PEQUEÑOS
===================================================== */

@media (max-width: 380px) {

    .actual {

        transform:
            translateX(-50%)
            scale(.84);

        bottom:
            6%;

    }


    .siguiente {

        left:
            calc(50% + 70px);

    }


    .frase {

        width:
            190px;

        left:
            -70px;

        font-size:
            14px;

    }

}


/* =====================================================
   PC
===================================================== */

@media (min-width: 700px) {

    .actual {

        transform:
            translateX(-50%)
            scale(1.12);

    }

    .siguiente {

        left:
            calc(50% + 145px);

    }

}

</style>

</head>


<body>


<div class="escena">


    <!-- CIELO -->

    <div class="sol"></div>

    <div class="nube nube1"></div>
    <div class="nube nube2"></div>
    <div class="nube nube3"></div>


    <!-- =================================================
         CAMPO
    ================================================== -->

    <div class="campo">

        <div id="girasoles"></div>

    </div>


    <!-- NIEBLA -->

    <div class="niebla"></div>


    <!-- =================================================
         GIRASOL ACTUAL
    ================================================== -->

    <div class="actual">


        <div
            class="numero"
            id="numero">
        </div>


        <div class="flor">

            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>

            <div class="centro"></div>

        </div>


        <div class="tallo">

            <div class="hoja izq"></div>

            <div class="hoja der"></div>

        </div>


    </div>


    <!-- =================================================
         GIRASOL SIGUIENTE
    ================================================== -->

    <div class="siguiente">


        <div class="frase">

            <strong id="diaSiguiente">
                🌱 Día 779
            </strong>

            <br><br>

            <span>
                ACA VA LA FRASE
            </span>

        </div>


        <div class="flor">

            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>

            <div class="centro"></div>

        </div>


        <div class="tallo"></div>


    </div>


</div>


<script>

/* =====================================================
   FECHA
===================================================== */

const inicio =
    new Date("2024-08-04T00:00:00");

const hoy =
    new Date();

inicio.setHours(0,0,0,0);
hoy.setHours(0,0,0,0);


const dias =
    Math.floor(
        (hoy - inicio) /
        (1000 * 60 * 60 * 24)
    );


/* =====================================================
   TEXTOS
===================================================== */

document.getElementById(
    "numero"
).textContent =
    `🌻 Día ${dias}`;


document.getElementById(
    "diaSiguiente"
).textContent =
    `🌱 Día ${dias + 1}`;


/* =====================================================
   CREAR CAMPO
===================================================== */

const campo =
    document.getElementById(
        "girasoles"
    );


/*
    MITAD DE LOS DÍAS

    Aproximadamente 389 flores.

    La idea es representar el paso
    del tiempo sin cargar el celular
    con las 778 flores.
*/

const cantidad =
    Math.floor(dias / 2);


/*
    DIVIDIMOS EL CAMPO EN ZONAS

    NO SON FILAS.

    Son sectores invisibles para
    garantizar que los girasoles
    ocupen toda la pantalla.

       |  |  |  |  |  |  |  |  |
     --------------------------------
     |  |  |  |  |  |  |  |  |  |
     --------------------------------
     |  |  |  |  |  |  |  |  |  |
     --------------------------------

    Después ponemos cada flor
    aleatoriamente dentro de su zona.
*/


const columnas = 13;
const filas = 9;


/*
    Creamos posiciones.

    Son bastantes más posiciones
    que las necesarias para que
    podamos elegir aleatoriamente.
*/

const posiciones = [];


for (
    let fila = 0;
    fila < filas;
    fila++
) {

    for (
        let columna = 0;
        columna < columnas;
        columna++
    ) {

        posiciones.push({

            columna,

            fila

        });

    }

}


/*
    Mezclamos.

    Esto evita que se perciba
    cualquier patrón de cuadrícula.
*/

posiciones.sort(
    () => Math.random() - 0.5
);


/* =====================================================
   CREAR LOS GIRASOLES
===================================================== */

for (
    let i = 0;
    i < cantidad;
    i++
) {


    const girasol =
        document.createElement(
            "div"
        );


    girasol.className =
        "girasol";


    /*
       Tomamos una zona.
    */

    const zona =
        posiciones[
            i % posiciones.length
        ];


    /*
       Cada zona ocupa solamente
       una parte del campo.

       Dentro de ella ponemos
       una posición aleatoria.

       Esto hace que estén
       distribuidos por TODA
       la superficie.
    */

    const anchoZona =
        100 / columnas;


    const altoZona =
        100 / filas;


    let x =
        zona.columna *
        anchoZona
        +
        Math.random() *
        anchoZona;


    let y =
        zona.fila *
        altoZona
        +
        Math.random() *
        altoZona;


    /*
       Un pequeño desplazamiento
       adicional para romper
       cualquier patrón.
    */

    x +=
        Math.random() * 3 - 1.5;

    y +=
        Math.random() * 3 - 1.5;


    /*
       PROFUNDIDAD

       Los de arriba están lejos.
       Los de abajo están cerca.

       0 = horizonte
       1 = primer plano
    */

    const profundidad =
        y / 100;


    /*
       Tamaño.

       Muy pequeños en el fondo,
       grandes adelante.
    */

    const escala =
        0.12 +
        profundidad * 0.82;


    /*
       Los del fondo se desvanecen.
    */

    const opacidad =
        0.28 +
        profundidad * 0.72;


    /*
       Niebla.

       Mucha en el horizonte,
       casi ninguna adelante.
    */

    const desenfoque =
        Math.max(
            0,
            (0.48 - profundidad) * 2.8
        );


    /*
       Variación aleatoria
       de tamaño.
    */

    const variacion =
        0.82 +
        Math.random() * 0.36;


    /*
       Posición.
    */

    girasol.style.left =
        `${x}%`;

    girasol.style.top =
        `${y}%`;


    /*
       Tamaño.
    */

    girasol.style.transform =
        `scale(${escala * variacion})`;


    /*
       Profundidad.
    */

    girasol.style.opacity =
        opacidad;


    girasol.style.filter =
        `blur(${desenfoque}px)`;


    /*
       Cada uno se mueve
       ligeramente diferente.
    */

    girasol.style.animationDelay =
        `${Math.random() * -5}s`;


    /*
       Z-index según profundidad.

       Los de adelante quedan
       naturalmente delante.
    */

    girasol.style.zIndex =
        Math.floor(
            profundidad * 400
        );


    /*
       HTML DEL GIRASOL

       Este es el diseño que
       mantenemos del anterior.
    */

    girasol.innerHTML = `

        <div class="flor">

            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>
            <div class="petalo"></div>

            <div class="centro"></div>

        </div>


        <div class="tallo">

            <div class="hoja izq"></div>

            <div class="hoja der"></div>

        </div>

    `;


    campo.appendChild(
        girasol
    );

}

</script>


</body>

</html>
