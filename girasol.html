<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>🌻 Nuestro campo</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #5d8f32;
    overflow-x: hidden;
}

/* =====================================================
   CIELO
===================================================== */

.cielo {
    position: fixed;
    inset: 0;
    z-index: -10;

    background:
        linear-gradient(
            to bottom,
            #65bce8 0%,
            #a9ddf3 35%,
            #e4f5dc 52%,
            #639b39 72%,
            #386b25 100%
        );
}

/* Sol */

.sol {
    position: fixed;

    width: 85px;
    height: 85px;

    top: 45px;
    right: 25px;

    border-radius: 50%;

    background: #ffe16b;

    box-shadow:
        0 0 25px rgba(255, 231, 119, .9),
        0 0 60px rgba(255, 231, 119, .45);

    z-index: -8;
}

/* =====================================================
   NUBES
===================================================== */

.nube {
    position: fixed;

    width: 120px;
    height: 35px;

    background: rgba(255,255,255,.72);

    border-radius: 40px;

    z-index: -7;
}

.nube::before,
.nube::after {
    content: "";

    position: absolute;

    background: rgba(255,255,255,.72);

    border-radius: 50%;
}

.nube::before {
    width: 45px;
    height: 45px;

    left: 15px;
    bottom: 5px;
}

.nube::after {
    width: 55px;
    height: 55px;

    right: 15px;
    bottom: 3px;
}

.nube1 {
    top: 90px;
    left: -20px;
}

.nube2 {
    top: 180px;
    right: -35px;
    transform: scale(.8);
}

/* =====================================================
   PORTADA
===================================================== */

.portada {
    min-height: 100svh;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    padding: 30px 20px;

    text-align: center;

    color: white;

    text-shadow:
        0 2px 5px rgba(0,0,0,.35);

    position: relative;
}

.portada h1 {
    font-size: clamp(38px, 11vw, 60px);

    font-weight: normal;

    margin: 0 0 15px;
}

.portada p {
    font-size: 17px;

    line-height: 1.5;

    max-width: 330px;

    margin: 0;
}

.flecha {
    position: absolute;

    bottom: 30px;

    font-size: 28px;

    animation: bajar 1.5s infinite;
}

@keyframes bajar {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(10px);
    }
}

/* =====================================================
   CAMPO
===================================================== */

.campo {
    position: relative;

    width: 100%;

    padding:
        70px
        10px
        100px;

    background:
        linear-gradient(
            to bottom,
            rgba(87,142,43,.3),
            #4c852d 20%,
            #356c24 100%
        );

    overflow: hidden;
}

/* =====================================================
   GIRASOLES
===================================================== */

.fila {
    width: 100%;

    display: flex;

    justify-content: space-around;
    align-items: flex-end;

    min-height: 125px;

    margin-bottom: 5px;

    position: relative;
}

.girasol {
    position: relative;

    width: 55px;

    height: 125px;

    flex-shrink: 0;

    transform-origin: bottom center;

    animation:
        viento 4s ease-in-out infinite;
}

.girasol:nth-child(2) {
    animation-delay: -1s;
}

.girasol:nth-child(3) {
    animation-delay: -2s;
}

/* =====================================================
   TALLO
===================================================== */

.tallo {
    position: absolute;

    bottom: 0;
    left: 50%;

    transform: translateX(-50%);

    width: 5px;
    height: 85px;

    background:
        linear-gradient(
            to right,
            #24551c,
            #529638,
            #24551c
        );

    border-radius: 5px;
}

/* =====================================================
   HOJAS
===================================================== */

.hoja {
    position: absolute;

    width: 35px;
    height: 16px;

    background: #4b9230;

    border-radius:
        100%
        0
        100%
        0;
}

.hoja.izquierda {
    left: -28px;
    top: 38px;

    transform: rotate(-25deg);
}

.hoja.derecha {
    right: -28px;
    top: 53px;

    transform:
        rotate(25deg)
        scaleX(-1);
}

/* =====================================================
   FLOR
===================================================== */

.flor {
    position: absolute;

    width: 55px;
    height: 55px;

    left: 50%;
    top: 0;

    transform:
        translateX(-50%);

    z-index: 2;
}

.petalo {
    position: absolute;

    width: 22px;
    height: 32px;

    left: 50%;
    top: 50%;

    transform-origin:
        50%
        100%;

    background:
        linear-gradient(
            to bottom,
            #ffe94a,
            #f5bd13
        );

    border-radius: 50%;
}

.petalo:nth-child(1) {
    transform:
        translate(-50%, -100%)
        rotate(0deg);
}

.petalo:nth-child(2) {
    transform:
        translate(-50%, -100%)
        rotate(45deg);
}

.petalo:nth-child(3) {
    transform:
        translate(-50%, -100%)
        rotate(90deg);
}

.petalo:nth-child(4) {
    transform:
        translate(-50%, -100%)
        rotate(135deg);
}

.petalo:nth-child(5) {
    transform:
        translate(-50%, -100%)
        rotate(180deg);
}

.petalo:nth-child(6) {
    transform:
        translate(-50%, -100%)
        rotate(225deg);
}

.petalo:nth-child(7) {
    transform:
        translate(-50%, -100%)
        rotate(270deg);
}

.petalo:nth-child(8) {
    transform:
        translate(-50%, -100%)
        rotate(315deg);
}

.centro {
    position: absolute;

    width: 27px;
    height: 27px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #8a5218 0%,
            #5c320b 75%
        );

    z-index: 5;
}

/* =====================================================
   VARIACIONES
===================================================== */

.pequeno {
    transform: scale(.65);
}

.medio {
    transform: scale(.82);
}

.grande {
    transform: scale(1);
}

/* =====================================================
   SEPARADORES
===================================================== */

.separador {
    height: 60px;
}

/* =====================================================
   GIRASOL ACTUAL
===================================================== */

.actual-container {

    min-height: 75svh;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding:
        40px
        15px
        100px;

    position: relative;
}

.actual-titulo {

    color: white;

    text-align: center;

    margin-bottom: 70px;

    text-shadow:
        0 2px 6px rgba(0,0,0,.4);
}

.actual-titulo small {

    display: block;

    font-size: 15px;

    margin-bottom: 8px;
}

.actual-titulo strong {

    font-size: 32px;

    font-weight: normal;
}

/* Girasol grande */

.girasol-actual {

    position: relative;

    width: 150px;
    height: 250px;

    animation:
        vientoGrande 5s ease-in-out infinite;

    transform-origin: bottom center;
}

.girasol-actual .tallo {

    width: 9px;
    height: 170px;
}

.girasol-actual .flor {

    width: 130px;
    height: 130px;

    top: 0;
}

.girasol-actual .petalo {

    width: 48px;
    height: 70px;
}

.girasol-actual .centro {

    width: 62px;
    height: 62px;
}

.girasol-actual .hoja {

    width: 65px;
    height: 28px;
}

.girasol-actual .hoja.izquierda {

    left: -55px;
    top: 85px;
}

.girasol-actual .hoja.derecha {

    right: -55px;
    top: 105px;
}

/* Número */

.numero {

    position: absolute;

    top: -75px;
    left: 50%;

    transform:
        translateX(-50%);

    white-space: nowrap;

    padding:
        10px
        18px;

    border-radius: 30px;

    background:
        rgba(255,255,255,.96);

    color: #684400;

    font-size: 21px;

    font-weight: bold;

    box-shadow:
        0 5px 20px rgba(0,0,0,.2);

    z-index: 20;
}

/* =====================================================
   SIGUIENTE GIRASOL
===================================================== */

.siguiente-container {

    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    margin-top: 70px;

    color: white;

    text-align: center;
}

.frase {

    max-width: 320px;

    margin-bottom: 30px;

    padding:
        18px
        20px;

    background:
        rgba(255,255,255,.95);

    color: #624500;

    border-radius: 18px;

    font-size: 16px;

    line-height: 1.5;

    box-shadow:
        0 6px 20px rgba(0,0,0,.2);
}

.frase strong {

    font-size: 18px;
}

/* Brote */

.brote {

    position: relative;

    width: 100px;
    height: 150px;

    animation:
        crecer 3s ease-in-out infinite;
}

.brote .tallo {

    height: 105px;

    width: 7px;
}

.brote .flor {

    width: 45px;
    height: 45px;

    top: 0;
}

.brote .petalo {

    width: 18px;
    height: 27px;
}

.brote .centro {

    width: 22px;
    height: 22px;
}

/* =====================================================
   ANIMACIONES
===================================================== */

@keyframes viento {

    0%,
    100% {
        transform:
            rotate(-1.5deg);
    }

    50% {
        transform:
            rotate(1.5deg);
    }
}

@keyframes vientoGrande {

    0%,
    100% {
        transform:
            rotate(-1deg);
    }

    50% {
        transform:
            rotate(1deg);
    }
}

@keyframes crecer {

    0%,
    100% {
        transform:
            scale(.92);
    }

    50% {
        transform:
            scale(1.04);
    }
}

/* =====================================================
   PANTALLAS GRANDES
===================================================== */

@media (min-width: 700px) {

    .campo {
        padding-left: 30px;
        padding-right: 30px;
    }

    .fila {
        max-width: 900px;

        margin-left: auto;
        margin-right: auto;

        min-height: 150px;
    }

    .girasol {
        transform: scale(.9);
    }
}

</style>
</head>


<body>

<!-- CIELO -->

<div class="cielo"></div>

<div class="sol"></div>

<div class="nube nube1"></div>
<div class="nube nube2"></div>


<!-- PORTADA -->

<section class="portada">

    <h1>🌻 Nuestro campo 🌻</h1>

    <p>
        Un girasol por cada día
        desde el 4 de agosto de 2024.
    </p>

    <div class="flecha">
        ↓
    </div>

</section>


<!-- CAMPO -->

<section class="campo">

    <div id="campoGirasoles"></div>


    <!-- GIRASOL ACTUAL -->

    <div class="actual-container">

        <div class="actual-titulo">

            <small>
                Y llegamos hasta acá...
            </small>

            <strong id="textoDia">
                Día
            </strong>

        </div>


        <div class="girasol-actual">

            <div
                class="numero"
                id="numeroDia">
            </div>


            <div class="flor">

                <div class="petalo"></div>
                <div class="petalo"></div>
                <div class="petalo"></div>
                <div class="petalo"></div>
                <div class="petalo"></div>
                <div class="petalo"></div>
                <div class="petalo"></div>
                <div class="petalo"></div>

                <div class="centro"></div>

            </div>


            <div class="tallo">

                <div class="hoja izquierda"></div>
                <div class="hoja derecha"></div>

            </div>

        </div>


        <!-- SIGUIENTE DÍA -->

        <div class="siguiente-container">

            <div class="frase">

                <strong id="diaSiguiente">
                    🌱 Día siguiente
                </strong>

                <br><br>

                <span>
                    ACA VA LA FRASE
                </span>

            </div>


            <div class="brote">

                <div class="flor">

                    <div class="petalo"></div>
                    <div class="petalo"></div>
                    <div class="petalo"></div>
                    <div class="petalo"></div>
                    <div class="petalo"></div>
                    <div class="petalo"></div>
                    <div class="petalo"></div>
                    <div class="petalo"></div>

                    <div class="centro"></div>

                </div>


                <div class="tallo"></div>

            </div>

        </div>

    </div>

</section>


<script>

/* =====================================================
   CÁLCULO DE DÍAS
===================================================== */

const fechaInicio =
    new Date("2024-08-04T00:00:00");

const fechaActual =
    new Date();

/*
   Ponemos ambas fechas a medianoche
   para evitar problemas por horas,
   minutos y segundos.
*/

fechaInicio.setHours(0,0,0,0);
fechaActual.setHours(0,0,0,0);

const diferencia =
    fechaActual - fechaInicio;

const dias =
    Math.floor(
        diferencia /
        (1000 * 60 * 60 * 24)
    );


/* =====================================================
   TEXTOS
===================================================== */

document.getElementById("textoDia")
    .textContent =
    `Día ${dias}`;

document.getElementById("numeroDia")
    .textContent =
    `🌻 Día ${dias}`;

document.getElementById("diaSiguiente")
    .textContent =
    `🌱 Día ${dias + 1}`;


/* =====================================================
   CREAR GIRASOLES
===================================================== */

const contenedor =
    document.getElementById(
        "campoGirasoles"
    );


/*
   En celular mostramos 3 girasoles
   por fila.

   Cada girasol representa
   un día diferente.
*/

let dia = 1;

while (dia <= dias) {

    const fila =
        document.createElement("div");

    fila.className = "fila";


    for (
        let posicion = 0;
        posicion < 3 && dia <= dias;
        posicion++
    ) {

        const girasol =
            document.createElement("div");

        girasol.className =
            "girasol " +
            (
                Math.random() > .5
                ? "pequeno"
                : "medio"
            );


        girasol.innerHTML = `

            <div class="flor">

                <div class="petalo"></div>
                <div class="petalo"></div>
                <div class="petalo"></div>
                <div class="petalo"></div>
                <div class="petalo"></div>
                <div class="petalo"></div>
                <div class="petalo"></div>
                <div class="petalo"></div>

                <div class="centro"></div>

            </div>

            <div class="tallo">

                <div class="hoja izquierda"></div>
                <div class="hoja derecha"></div>

            </div>
        `;


        /*
           Pequeñas diferencias de altura
           para que no parezcan plantados
           perfectamente.
        */

        const desplazamiento =
            Math.floor(
                Math.random() * 20
            ) - 10;

        girasol.style.transform =
            `translateY(${desplazamiento}px) ` +
            `scale(${Math.random() * .25 + .65})`;


        fila.appendChild(girasol);

        dia++;
    }


    contenedor.appendChild(fila);
}

</script>

</body>
</html>
